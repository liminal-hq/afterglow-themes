Afterglow boot logo: a half-set gold sun over concentric dusk bands, the kernel boot screen logo

(c) Copyright 2026 Liminal HQ, Scott Morris
SPDX-License-Identifier: Apache-2.0 OR MIT

Master at 4x (1656 x 1464) of a 414 x 366 bitmap: the artwork is drawn in bitmap pixels inside one scale(4) group.
Every fill is one of the 16 palette entries in palette.json (the design colours the bitmap stores), so the render snaps cleanly to it. The wordmark and the
caption are outlined from Noto Sans Light and Medium, so no font is needed to render it. The box at 138,328 to 277,366
is the kernel's progress bar and stays empty.
-->
