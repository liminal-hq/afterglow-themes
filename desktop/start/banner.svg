Afterglow Start menu banner: a dusk gradient with a small setting sun and the Afterglow name reading upward

(c) Copyright 2026 Liminal HQ, Scott Morris
SPDX-License-Identifier: Apache-2.0 OR MIT

Master at 8x (168 x 1864) of the 21 x 233 bitmap 158 in the ReactOS explorer.exe, which is 24-bit with no alpha. The top is the
menu's navy (#090e2a) and the dusk ramp warms toward the foot. The wordmark reads from the bottom up, as the stock banner's does,
and is outlined from Noto Sans Light (the Noto font licence allows embedding outlines), so no font is needed to render it.
No ReactOS wordmark or art is used. Every colour is an Afterglow desktop token (see desktop/boot/palette.json).
-->
