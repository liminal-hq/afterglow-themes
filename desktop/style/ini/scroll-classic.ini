; The default scroll bars: classic Windows ones. The engine paints a window's own scroll bars only through this class, so a style
; that leaves it out gets no arrow buttons and stale thumbs; these sections draw the classic look instead (classic scheme colours, a
; dithered track, raised buttons). They replace the [Scrollbar.*] sections of normal.ini unless the style is built with --scrollbars.
; (c) Copyright 2026 Liminal HQ, Scott Morris
; SPDX-License-Identifier: Apache-2.0 OR MIT
;
; Arrow buttons: sixteen states (up, down, left, right; each normal, hot, pressed, disabled).
[Scrollbar.ArrowBtn]
BgType = ImageFile
ImageFile = scroll/arrow.bmp
GlyphType = ImageGlyph
GlyphImageFile = scroll/arrow-glyph.bmp
ImageCount = 16
ImageLayout = Vertical
SizingMargins = 2, 2, 2, 2
GlyphTransparent = True

[Scrollbar.ThumbBtnVert]
BgType = ImageFile
ImageFile = scroll/thumb-v.bmp
ImageCount = 4
ImageLayout = Vertical
SizingMargins = 2, 2, 2, 2

[Scrollbar.ThumbBtnHorz]
BgType = ImageFile
ImageFile = scroll/thumb-h.bmp
ImageCount = 4
ImageLayout = Vertical
SizingMargins = 2, 2, 2, 2

; Classic thumbs have no grip. A part with no section is drawn as a default white box, so say it is not drawn.
[Scrollbar.GripperVert]
BgType = None

[Scrollbar.GripperHorz]
BgType = None

[Scrollbar.LowerTrackVert]
BgType = ImageFile
ImageFile = scroll/track.bmp
SizingType = Tile

[Scrollbar.UpperTrackVert]
BgType = ImageFile
ImageFile = scroll/track.bmp
SizingType = Tile

[Scrollbar.LowerTrackHorz]
BgType = ImageFile
ImageFile = scroll/track.bmp
SizingType = Tile

[Scrollbar.UpperTrackHorz]
BgType = ImageFile
ImageFile = scroll/track.bmp
SizingType = Tile

[Scrollbar.LowerTrackVert(Pressed)]
ImageFile = scroll/track-pressed.bmp

[Scrollbar.UpperTrackVert(Pressed)]
ImageFile = scroll/track-pressed.bmp

[Scrollbar.LowerTrackHorz(Pressed)]
ImageFile = scroll/track-pressed.bmp

[Scrollbar.UpperTrackHorz(Pressed)]
ImageFile = scroll/track-pressed.bmp

[Scrollbar.SizeBox]
BgType = ImageFile
ImageFile = scroll/sizebox.bmp
ImageCount = 2
ImageLayout = Vertical
SizingType = TrueSize
HAlign = Right
VAlign = Bottom
