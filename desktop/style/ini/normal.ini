; Afterglow original: the Normal size, written once for every colour scheme (Dusk, Ember, Aurora, Graphite and their Light
; variants).
; Hand-written for the ReactOS 0.4.16 theme engine (uxtheme). For each scheme gen.py replaces each {token} with that scheme's
; palette colour as "R G B", points each image at the scheme's own copy when its pixels differ from a shared one, checks that
; every image named here was drawn, and writes the result as UTF-16LE (one INI resource per scheme).
;
; (c) Copyright 2026 Liminal HQ, Scott Morris
; SPDX-License-Identifier: Apache-2.0 OR MIT
;
; Layout of this file: system colours first, then the window frame, scroll bars, dialog controls, list and tree controls, and
; last the shell (taskbar, Start button, task buttons, tray). Image paths are relative to the style; the engine turns "a/b.bmp"
; into the resource name A_B_BMP.

; ---- System colours --------------------------------------------------------------------------------------------------------
; ReactOS reads these for caption text. Display Properties also copies them into the colour scheme when the style or one of
; its colour schemes is picked there, so every colour an application paints with stays the classic cream scheme in every
; scheme; only the title colours (and the desktop colour behind the wallpaper) follow the scheme.
[SysMetrics]
Scrollbar = {cream}
Background = {desktop}
ActiveCaption = {dusk1}
InactiveCaption = {raised}
Menu = {cream}
Window = 255 255 255
WindowFrame = 0 0 0
MenuText = 0 0 0
WindowText = 0 0 0
CaptionText = {title_text}
ActiveBorder = {cream}
InactiveBorder = {cream}
AppWorkspace = 128 128 128
Highlight = 10 36 106
HighlightText = 255 255 255
BtnFace = {cream}
BtnShadow = 128 128 128
GrayText = 128 128 128
BtnText = 0 0 0
InactiveCaptionText = {muted}
BtnHighlight = 255 255 255
DkShadow3d = 64 64 64
Light3d = {cream}
InfoText = 0 0 0
InfoBk = 255 255 225
ButtonAlternateFace = 181 181 181
HotTracking = 0 0 128
GradientActiveCaption = {dusk7}
GradientInactiveCaption = {raised2}
MenuHilight = 10 36 106
MenuBar = {cream}
FlatMenus = False
; Caption sizes (pixels). Display Properties applies these; afterglow-original.reg sets the same values for the registry route.
; The engine draws the title in a box 7 px shorter than SM_CYCAPTION minus the button gaps, so 24 leaves room for an 8 pt bold
; title without clipping.
CaptionBarHeight = 24
CaptionBarWidth = 24
SmCaptionBarHeight = 23
SmCaptionBarWidth = 23

