# Afterglow Dark for Midnight Commander (truecolour): solid indigo-black with a purple accent.
# Generated from the Afterglow palette by scripts/build-mc.mjs. Edit the generator, not this file.
# Needs mc 4.8.19 or newer built against S-Lang, and a terminal with COLORTERM=truecolor (or 24bit).
# Without that, use afterglow-dark-256 instead.

[skin]
    description = Afterglow Dark
    truecolors = true

[Lines]
    horiz = ─
    vert = │
    lefttop = ┌
    righttop = ┐
    leftbottom = └
    rightbottom = ┘
    topmiddle = ┬
    bottommiddle = ┴
    leftmiddle = ├
    rightmiddle = ┤
    cross = ┼
    dhoriz = ═
    dvert = ║
    dlefttop = ╔
    drighttop = ╗
    dleftbottom = ╚
    drightbottom = ╝
    dtopmiddle = ╤
    dbottommiddle = ╧
    dleftmiddle = ╟
    drightmiddle = ╢

[core]
    _default_ = #e4e2ec;#0f0e1a
    selected = #f1eee6;#2a4064
    marked = #fbbf24;#0f0e1a;bold
    markselect = #fddc87;#2a4064;bold
    gauge = #0f0e1a;#a78bfa
    input = #f1eee6;#0f0e1a
    inputunchanged = #b8b6c8;#0f0e1a
    inputmark = #f1eee6;#2a4064
    disabled = #8f8da6;#2a2840
    reverse = #0f0e1a;#b8b6c8
    commandlinemark = #f1eee6;#2a4064
    header = #ffaa40;#0f0e1a;bold
    inputhistory = #b8b6c8;#0f0e1a
    commandhistory = #8f8da6;#0f0e1a
    shadow = #5f5d78;#0f0e1a

[dialog]
    _default_ = #e4e2ec;#2a2840
    dfocus = #f1eee6;#2a4064
    dhotnormal = #a78bfa;#2a2840
    dhotfocus = #cfbffc;#2a4064
    dtitle = #ffaa40;#2a2840;bold

[error]
    _default_ = #f1eee6;#5b1e30
    errdfocus = #f1eee6;#a22d46
    errdhotnormal = #fbbf24;#5b1e30
    errdhotfocus = #fddc87;#a22d46
    errdtitle = #fddc87;#5b1e30;bold

[filehighlight]
    directory = #60a5fa;#0f0e1a;bold
    executable = #2ec66a;#0f0e1a;bold
    symlink = #22d3ee;#0f0e1a
    hardlink = #85e7f6;#0f0e1a
    stalelink = #f43f5e;#0f0e1a
    device = #fbbf24;#0f0e1a
    special = #fddc87;#0f0e1a
    core = #f995a6;#0f0e1a
    temp = #8f8da6;#0f0e1a
    archive = #ffaa40;#0f0e1a
    doc = #b8b6c8;#0f0e1a
    source = #a78bfa;#0f0e1a
    media = #cfbffc;#0f0e1a
    graph = #a8cefc;#0f0e1a
    database = #ffd096;#0f0e1a

[menu]
    _default_ = #e4e2ec;#2a2840
    menusel = #f1eee6;#2a4064
    menuhot = #a78bfa;#2a2840
    menuhotsel = #cfbffc;#2a4064
    menuinactive = #b8b6c8;#1a1828

[popupmenu]
    _default_ = #e4e2ec;#2a2840
    menusel = #f1eee6;#2a4064
    menutitle = #ffaa40;#2a2840;bold

[buttonbar]
    hotkey = #f1eee6;#2d2747
    button = #e4e2ec;#1a1828

[statusbar]
    _default_ = #e4e2ec;#1a1828

[help]
    _default_ = #e4e2ec;#1a1828
    helpitalic = #22d3ee;#1a1828;italic
    helpbold = #ffaa40;#1a1828;bold
    helplink = #60a5fa;#1a1828
    helpslink = #f1eee6;#2a4064
    helptitle = #a78bfa;#1a1828;bold

[editor]
    _default_ = #e4e2ec;#0f0e1a
    editbold = #ffaa40;#0f0e1a;bold
    editmarked = #f1eee6;#2a4064
    editwhitespace = #5f5d78;#0f0e1a
    editlinestate = #b8b6c8;#1a1828
    bookmark = #0f0e1a;#fbbf24
    bookmarkfound = #0f0e1a;#2ec66a
    editrightmargin = #b8b6c8;#1a1828
    editframeactive = #a78bfa;#0f0e1a
    editframedrag = #2ec66a;#0f0e1a
    editframe = #8f8da6;#0f0e1a
    editbg = #e4e2ec;#0f0e1a

[viewer]
    _default_ = #e4e2ec;#0f0e1a
    viewbold = #ffaa40;#0f0e1a;bold
    viewunderline = #22d3ee;#0f0e1a;underline
    viewselected = #0f0e1a;#a78bfa

[diffviewer]
    added = #f1eee6;#15332a
    changedline = #f1eee6;#1f2c47
    changednew = #f1eee6;#5d481d
    changed = #f1eee6;#2a4064
    removed = #f1eee6;#3d1828
    error = #f1eee6;#261321
    _default_ = #e4e2ec;#0f0e1a

[widget-panel]
    sort-up-char = ▴
    sort-down-char = ▾
    hiddenfiles-show-char = •
    hiddenfiles-hide-char = ○
    history-prev-item-char = ◂
    history-next-item-char = ▸
    history-show-list-char = ▾
    filename-scroll-left-char = ◂
    filename-scroll-right-char = ▸
    hiddenfiles-sign-show = •
    hiddenfiles-sign-hide = ○
    history-prev-item-sign = ◂
    history-next-item-sign = ▸
    history-show-list-sign = ▾

[widget-scrollbar]
    first-vert-char = ▴
    last-vert-char = ▾
    first-horiz-char = ◂
    last-horiz-char = ▸
    current-char = ■
    background-char = ▒

[widget-editor]
    window-state-char = ↕
    window-close-char = ✕

[widget-common]
    sort-sign-up = ↑
    sort-sign-down = ↓
