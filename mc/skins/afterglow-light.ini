# Afterglow Light for Midnight Commander (truecolour): warm paper with a purple accent.
# Generated from the Afterglow palette by scripts/build-mc.mjs. Edit the generator, not this file.
# Needs mc 4.8.19 or newer built against S-Lang 2.3.1 or newer on a 64-bit system, and a terminal with COLORTERM=truecolor (or 24bit).
# Without that, use afterglow-light-256 instead.

[skin]
    description = Afterglow Light
    truecolors = true

[Lines]
    horiz = ─
    vert = │
    lefttop = ┌
    righttop = ┐
    leftbottom = └
    rightbottom = ┘
    topmiddle = ┬
    bottommiddle = ┴
    leftmiddle = ├
    rightmiddle = ┤
    cross = ┼
    dhoriz = ═
    dvert = ║
    dlefttop = ╔
    drighttop = ╗
    dleftbottom = ╚
    drightbottom = ╝
    dtopmiddle = ╤
    dbottommiddle = ╧
    dleftmiddle = ╟
    drightmiddle = ╢

[core]
    _default_ = #2b2a33;#fbfaf6
    selected = #1c1b20;#bfd0f3
    marked = #a16207;#fbfaf6;bold
    markselect = #694005;#bfd0f3;bold
    gauge = #fbfaf6;#5e44cc
    input = #1c1b20;#fbfaf6
    inputunchanged = #484554;#fbfaf6
    inputmark = #1c1b20;#bfd0f3
    disabled = #6b6877;#e6e0eb
    reverse = #fbfaf6;#484554
    commandlinemark = #1c1b20;#bfd0f3
    header = #b45309;#fbfaf6;bold
    inputhistory = #484554;#fbfaf6
    commandhistory = #6b6877;#fbfaf6
    shadow = #8f8c98;#c9c5d0

[dialog]
    _default_ = #2b2a33;#e6e0eb
    dfocus = #1c1b20;#bfd0f3
    dhotnormal = #5e44cc;#e6e0eb
    dhotfocus = #3d2c85;#bfd0f3
    dtitle = #753606;#e6e0eb;bold

[error]
    _default_ = #1c1b20;#f1d5d8
    errdfocus = #1c1b20;#eab9c2
    errdhotnormal = #694005;#f1d5d8
    errdhotfocus = #694005;#eab9c2
    errdtitle = #694005;#f1d5d8;bold

[filehighlight]
    directory = #2563eb;#fbfaf6;bold
    executable = #15803d;#fbfaf6;bold
    symlink = #0e7490;#fbfaf6
    hardlink = #094b5e;#fbfaf6
    stalelink = #be123c;#fbfaf6
    device = #a16207;#fbfaf6
    special = #694005;#fbfaf6
    core = #7c0c27;#fbfaf6
    temp = #6b6877;#fbfaf6
    archive = #b45309;#fbfaf6
    doc = #484554;#fbfaf6
    source = #5e44cc;#fbfaf6
    media = #3d2c85;#fbfaf6
    graph = #184099;#fbfaf6
    database = #753606;#fbfaf6

[menu]
    _default_ = #2b2a33;#e6e0eb
    menusel = #1c1b20;#bfd0f3
    menuhot = #5e44cc;#e6e0eb
    menuhotsel = #3d2c85;#bfd0f3
    menuinactive = #484554;#f2eff4

[popupmenu]
    _default_ = #2b2a33;#e6e0eb
    menusel = #1c1b20;#bfd0f3
    menutitle = #753606;#e6e0eb;bold

[buttonbar]
    hotkey = #1c1b20;#e2ddef
    button = #2b2a33;#f2eff4

[statusbar]
    _default_ = #2b2a33;#f2eff4

[help]
    _default_ = #2b2a33;#f2eff4
    helpitalic = #0e7490;#f2eff4;italic
    helpbold = #753606;#f2eff4;bold
    helplink = #2563eb;#f2eff4
    helpslink = #1c1b20;#bfd0f3
    helptitle = #5e44cc;#f2eff4;bold

[editor]
    _default_ = #2b2a33;#fbfaf6
    editbold = #b45309;#fbfaf6;bold
    editmarked = #1c1b20;#bfd0f3
    editwhitespace = #8f8c98;#fbfaf6
    editlinestate = #484554;#f2eff4
    bookmark = #fbfaf6;#a16207
    bookmarkfound = #fbfaf6;#15803d
    editrightmargin = #484554;#f2eff4
    editframeactive = #5e44cc;#fbfaf6
    editframedrag = #15803d;#fbfaf6
    editframe = #6b6877;#fbfaf6
    editbg = #2b2a33;#fbfaf6

[viewer]
    _default_ = #2b2a33;#fbfaf6
    viewbold = #b45309;#fbfaf6;bold
    viewunderline = #0e7490;#fbfaf6;underline
    viewselected = #fbfaf6;#5e44cc

[diffviewer]
    added = #1c1b20;#d6e6d8
    changedline = #1c1b20;#d9e2f4
    changednew = #1c1b20;#e2cfb3
    changed = #1c1b20;#bfd0f3
    removed = #1c1b20;#f1d5d8
    error = #1c1b20;#f6e7e7
    _default_ = #2b2a33;#fbfaf6

[widget-panel]
    sort-up-char = ▴
    sort-down-char = ▾
    hiddenfiles-show-char = •
    hiddenfiles-hide-char = ○
    history-prev-item-char = ◂
    history-next-item-char = ▸
    history-show-list-char = ▾
    filename-scroll-left-char = ◂
    filename-scroll-right-char = ▸
    hiddenfiles-sign-show = •
    hiddenfiles-sign-hide = ○
    history-prev-item-sign = ◂
    history-next-item-sign = ▸
    history-show-list-sign = ▾

[widget-scrollbar]
    first-vert-char = ▴
    last-vert-char = ▾
    first-horiz-char = ◂
    last-horiz-char = ▸
    current-char = ■
    background-char = ▒

[widget-editor]
    window-state-char = ↕
    window-close-char = ✕

[widget-common]
    sort-sign-up = ↑
    sort-sign-down = ↓
