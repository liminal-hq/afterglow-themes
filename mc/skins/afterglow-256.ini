# Afterglow for Midnight Commander (256-colour): the signature void, with the terminal background showing through.
# Generated from the Afterglow palette by scripts/build-mc.mjs. Edit the generator, not this file.
# For terminals that report 256 colours (TERM=xterm-256color) but not truecolour.
# The main panels, viewer and editor use the terminal default background so transparency shows through.

[skin]
    description = Afterglow (256 colours)
    256colors = true

[Lines]
    horiz = ─
    vert = │
    lefttop = ┌
    righttop = ┐
    leftbottom = └
    rightbottom = ┘
    topmiddle = ┬
    bottommiddle = ┴
    leftmiddle = ├
    rightmiddle = ┤
    cross = ┼
    dhoriz = ═
    dvert = ║
    dlefttop = ╔
    drighttop = ╗
    dleftbottom = ╚
    drightbottom = ╝
    dtopmiddle = ╤
    dbottommiddle = ╧
    dleftmiddle = ╟
    drightmiddle = ╢

[core]
    _default_ = color254;default
    selected = color255;color237
    marked = color214;default;bold
    markselect = color222;color237;bold
    gauge = color232;color215
    input = color255;color232
    inputunchanged = color250;color232
    inputmark = color255;color237
    disabled = color246;color235
    reverse = color232;color250
    commandlinemark = color255;color237
    header = color215;default;bold
    inputhistory = color250;color232
    commandhistory = color246;default
    shadow = color241;color232

[dialog]
    _default_ = color254;color235
    dfocus = color255;color237
    dhotnormal = color215;color235
    dhotfocus = color222;color237
    dtitle = color215;color235;bold

[error]
    _default_ = color255;color235
    errdfocus = color255;color125
    errdhotnormal = color214;color235
    errdhotfocus = color222;color125
    errdtitle = color222;color235;bold

[filehighlight]
    directory = color75;default;bold
    executable = color41;default;bold
    symlink = color45;default
    hardlink = color117;default
    stalelink = color203;default
    device = color214;default
    special = color222;default
    core = color211;default
    temp = color246;default
    archive = color215;default
    doc = color250;default
    source = color141;default
    media = color183;default
    graph = color153;default
    database = color223;default

[menu]
    _default_ = color254;color235
    menusel = color255;color237
    menuhot = color215;color235
    menuhotsel = color222;color237
    menuinactive = color250;color233

[popupmenu]
    _default_ = color254;color235
    menusel = color255;color237
    menutitle = color215;color235;bold

[buttonbar]
    hotkey = color255;color235
    button = color254;color233

[statusbar]
    _default_ = color254;color233

[help]
    _default_ = color254;color233
    helpitalic = color45;color233;italic
    helpbold = color215;color233;bold
    helplink = color75;color233
    helpslink = color255;color237
    helptitle = color141;color233;bold

[editor]
    _default_ = color254;default
    editbold = color215;default;bold
    editmarked = color255;color237
    editwhitespace = color241;default
    editlinestate = color250;color233
    bookmark = color232;color214
    bookmarkfound = color232;color41
    editrightmargin = color250;color233
    editframeactive = color215;default
    editframedrag = color41;default
    editframe = color246;default
    editbg = color254;default

[viewer]
    _default_ = color254;default
    viewbold = color215;default;bold
    viewunderline = color45;default;underline
    viewselected = color232;color215

[diffviewer]
    added = color255;color234
    changedline = color255;color235
    changednew = color255;color58
    changed = color255;color237
    removed = color255;color234
    error = color255;color233
    _default_ = color254;default

[widget-panel]
    sort-up-char = ▴
    sort-down-char = ▾
    hiddenfiles-show-char = •
    hiddenfiles-hide-char = ○
    history-prev-item-char = ◂
    history-next-item-char = ▸
    history-show-list-char = ▾
    filename-scroll-left-char = ◂
    filename-scroll-right-char = ▸
    hiddenfiles-sign-show = •
    hiddenfiles-sign-hide = ○
    history-prev-item-sign = ◂
    history-next-item-sign = ▸
    history-show-list-sign = ▾

[widget-scrollbar]
    first-vert-char = ▴
    last-vert-char = ▾
    first-horiz-char = ◂
    last-horiz-char = ▸
    current-char = ■
    background-char = ▒

[widget-editor]
    window-state-char = ↕
    window-close-char = ✕

[widget-common]
    sort-sign-up = ↑
    sort-sign-down = ↓
