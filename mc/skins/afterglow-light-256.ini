# Afterglow Light for Midnight Commander (256-colour): warm paper with a purple accent.
# Generated from the Afterglow palette by scripts/build-mc.mjs. Edit the generator, not this file.
# For terminals that report 256 colours (TERM=xterm-256color) but not truecolour.

[skin]
    description = Afterglow Light (256 colours)
    256colors = true

[Lines]
    horiz = ─
    vert = │
    lefttop = ┌
    righttop = ┐
    leftbottom = └
    rightbottom = ┘
    topmiddle = ┬
    bottommiddle = ┴
    leftmiddle = ├
    rightmiddle = ┤
    cross = ┼
    dhoriz = ═
    dvert = ║
    dlefttop = ╔
    drighttop = ╗
    dleftbottom = ╚
    drightbottom = ╝
    dtopmiddle = ╤
    dbottommiddle = ╧
    dleftmiddle = ╟
    drightmiddle = ╢

[core]
    _default_ = color236;color231
    selected = color234;color153
    marked = color130;color231;bold
    markselect = color237;color153;bold
    gauge = color231;color62
    input = color234;color231
    inputunchanged = color239;color231
    inputmark = color234;color153
    disabled = color242;color254
    reverse = color231;color239
    commandlinemark = color234;color153
    header = color130;color231;bold
    inputhistory = color239;color231
    commandhistory = color242;color231
    shadow = color246;color251

[dialog]
    _default_ = color236;color254
    dfocus = color234;color153
    dhotnormal = color60;color254
    dhotfocus = color54;color153
    dtitle = color94;color254;bold

[error]
    _default_ = color234;color224
    errdfocus = color234;color181
    errdhotnormal = color58;color224
    errdhotfocus = color237;color181
    errdtitle = color58;color224;bold

[filehighlight]
    directory = color26;color231;bold
    executable = color29;color231;bold
    symlink = color24;color231
    hardlink = color23;color231
    stalelink = color125;color231
    device = color130;color231
    special = color58;color231
    core = color88;color231
    temp = color242;color231
    archive = color130;color231
    doc = color239;color231
    source = color62;color231
    media = color54;color231
    graph = color24;color231
    database = color94;color231

[menu]
    _default_ = color236;color254
    menusel = color234;color153
    menuhot = color60;color254
    menuhotsel = color54;color153
    menuinactive = color239;color255

[popupmenu]
    _default_ = color236;color254
    menusel = color234;color153
    menutitle = color94;color254;bold

[buttonbar]
    hotkey = color234;color254
    button = color236;color255

[statusbar]
    _default_ = color236;color255

[help]
    _default_ = color236;color255
    helpitalic = color24;color255;italic
    helpbold = color94;color255;bold
    helplink = color26;color255
    helpslink = color234;color153
    helptitle = color61;color255;bold

[editor]
    _default_ = color236;color231
    editbold = color130;color231;bold
    editmarked = color234;color153
    editwhitespace = color246;color231
    editlinestate = color239;color255
    bookmark = color231;color130
    bookmarkfound = color231;color29
    editrightmargin = color239;color255
    editframeactive = color62;color231
    editframedrag = color29;color231
    editframe = color242;color231
    editbg = color236;color231

[viewer]
    _default_ = color236;color231
    viewbold = color130;color231;bold
    viewunderline = color24;color231;underline
    viewselected = color231;color62

[diffviewer]
    added = color234;color253
    changedline = color234;color189
    changednew = color234;color187
    changed = color234;color153
    removed = color234;color224
    error = color234;color255
    _default_ = color236;color231

[widget-panel]
    sort-up-char = ▴
    sort-down-char = ▾
    hiddenfiles-show-char = •
    hiddenfiles-hide-char = ○
    history-prev-item-char = ◂
    history-next-item-char = ▸
    history-show-list-char = ▾
    filename-scroll-left-char = ◂
    filename-scroll-right-char = ▸
    hiddenfiles-sign-show = •
    hiddenfiles-sign-hide = ○
    history-prev-item-sign = ◂
    history-next-item-sign = ▸
    history-show-list-sign = ▾

[widget-scrollbar]
    first-vert-char = ▴
    last-vert-char = ▾
    first-horiz-char = ◂
    last-horiz-char = ▸
    current-char = ■
    background-char = ▒

[widget-editor]
    window-state-char = ↕
    window-close-char = ✕

[widget-common]
    sort-sign-up = ↑
    sort-sign-down = ↓
