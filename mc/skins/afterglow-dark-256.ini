# Afterglow Dark for Midnight Commander (256-colour): solid indigo-black with a purple accent.
# Generated from the Afterglow palette by scripts/build-mc.mjs. Edit the generator, not this file.
# For terminals that report 256 colours (TERM=xterm-256color) but not truecolour.

[skin]
    description = Afterglow Dark (256 colours)
    256colors = true

[Lines]
    horiz = ─
    vert = │
    lefttop = ┌
    righttop = ┐
    leftbottom = └
    rightbottom = ┘
    topmiddle = ┬
    bottommiddle = ┴
    leftmiddle = ├
    rightmiddle = ┤
    cross = ┼
    dhoriz = ═
    dvert = ║
    dlefttop = ╔
    drighttop = ╗
    dleftbottom = ╚
    drightbottom = ╝
    dtopmiddle = ╤
    dbottommiddle = ╧
    dleftmiddle = ╟
    drightmiddle = ╢

[core]
    _default_ = color254;color233
    selected = color255;color238
    marked = color214;color233;bold
    markselect = color222;color238;bold
    gauge = color233;color141
    input = color255;color233
    inputunchanged = color250;color233
    inputmark = color255;color238
    disabled = color103;color236
    reverse = color233;color250
    commandlinemark = color255;color238
    header = color215;color233;bold
    inputhistory = color250;color233
    commandhistory = color103;color233
    shadow = color60;color233

[dialog]
    _default_ = color254;color236
    dfocus = color255;color238
    dhotnormal = color141;color236
    dhotfocus = color183;color238
    dtitle = color215;color236;bold

[error]
    _default_ = color255;color236
    errdfocus = color255;color125
    errdhotnormal = color214;color236
    errdhotfocus = color222;color125
    errdtitle = color222;color236;bold

[filehighlight]
    directory = color75;color233;bold
    executable = color41;color233;bold
    symlink = color45;color233
    hardlink = color117;color233
    stalelink = color203;color233
    device = color214;color233
    special = color222;color233
    core = color211;color233
    temp = color103;color233
    archive = color215;color233
    doc = color250;color233
    source = color141;color233
    media = color183;color233
    graph = color153;color233
    database = color222;color233

[menu]
    _default_ = color254;color236
    menusel = color255;color238
    menuhot = color141;color236
    menuhotsel = color183;color238
    menuinactive = color250;color234

[popupmenu]
    _default_ = color254;color236
    menusel = color255;color238
    menutitle = color215;color236;bold

[buttonbar]
    hotkey = color255;color236
    button = color254;color234

[statusbar]
    _default_ = color254;color234

[help]
    _default_ = color254;color234
    helpitalic = color45;color234;italic
    helpbold = color215;color234;bold
    helplink = color75;color234
    helpslink = color255;color238
    helptitle = color141;color234;bold

[editor]
    _default_ = color254;color233
    editbold = color215;color233;bold
    editmarked = color255;color238
    editwhitespace = color60;color233
    editlinestate = color250;color234
    bookmark = color233;color214
    bookmarkfound = color233;color41
    editrightmargin = color250;color234
    editframeactive = color141;color233
    editframedrag = color41;color233
    editframe = color103;color233
    editbg = color254;color233

[viewer]
    _default_ = color254;color233
    viewbold = color215;color233;bold
    viewunderline = color45;color233;underline
    viewselected = color233;color141

[diffviewer]
    added = color255;color235
    changedline = color255;color236
    changednew = color255;color58
    changed = color255;color238
    removed = color255;color235
    error = color255;color234
    _default_ = color254;color233

[widget-panel]
    sort-up-char = ▴
    sort-down-char = ▾
    hiddenfiles-show-char = •
    hiddenfiles-hide-char = ○
    history-prev-item-char = ◂
    history-next-item-char = ▸
    history-show-list-char = ▾
    filename-scroll-left-char = ◂
    filename-scroll-right-char = ▸
    hiddenfiles-sign-show = •
    hiddenfiles-sign-hide = ○
    history-prev-item-sign = ◂
    history-next-item-sign = ▸
    history-show-list-sign = ▾

[widget-scrollbar]
    first-vert-char = ▴
    last-vert-char = ▾
    first-horiz-char = ◂
    last-horiz-char = ▸
    current-char = ■
    background-char = ▒

[widget-editor]
    window-state-char = ↕
    window-close-char = ✕

[widget-common]
    sort-sign-up = ↑
    sort-sign-down = ↓
