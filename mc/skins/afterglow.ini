# Afterglow for Midnight Commander (truecolour): the signature void, with the terminal background showing through.
# Generated from the Afterglow palette by scripts/build-mc.mjs. Edit the generator, not this file.
# Needs mc 4.8.19 or newer built against S-Lang, and a terminal with COLORTERM=truecolor (or 24bit).
# Without that, use afterglow-256 instead.
# The main panels, viewer and editor use the terminal default background so transparency shows through.

[skin]
    description = Afterglow
    truecolors = true

[Lines]
    horiz = ─
    vert = │
    lefttop = ┌
    righttop = ┐
    leftbottom = └
    rightbottom = ┘
    topmiddle = ┬
    bottommiddle = ┴
    leftmiddle = ├
    rightmiddle = ┤
    cross = ┼
    dhoriz = ═
    dvert = ║
    dlefttop = ╔
    drighttop = ╗
    dleftbottom = ╚
    drightbottom = ╝
    dtopmiddle = ╤
    dbottommiddle = ╧
    dleftmiddle = ╟
    drightmiddle = ╢

[core]
    _default_ = #e0e0e0;default
    selected = #f4f4f8;#3a3157
    marked = #fbbf24;default;bold
    markselect = #fddc87;#3a3157;bold
    gauge = #050507;#ffaa40
    input = #f4f4f8;#050507
    inputunchanged = #b4bfce;#050507
    inputmark = #f4f4f8;#3a3157
    disabled = #8d97a8;#1f2230
    reverse = #050507;#b4bfce
    commandlinemark = #f4f4f8;#3a3157
    header = #ffaa40;default;bold
    inputhistory = #b4bfce;#050507
    commandhistory = #8d97a8;default
    shadow = #5a6273;#050507

[dialog]
    _default_ = #e0e0e0;#1f2230
    dfocus = #f4f4f8;#3a3157
    dhotnormal = #ffaa40;#1f2230
    dhotfocus = #ffd096;#3a3157
    dtitle = #ffaa40;#1f2230;bold

[error]
    _default_ = #f4f4f8;#541824
    errdfocus = #f4f4f8;#9e2a3f
    errdhotnormal = #fbbf24;#541824
    errdhotfocus = #fddc87;#9e2a3f
    errdtitle = #fddc87;#541824;bold

[filehighlight]
    directory = #60a5fa;default;bold
    executable = #2ec66a;default;bold
    symlink = #22d3ee;default
    hardlink = #85e7f6;default
    stalelink = #f43f5e;default
    device = #fbbf24;default
    special = #fddc87;default
    core = #f995a6;default
    temp = #8d97a8;default
    archive = #ffaa40;default
    doc = #b4bfce;default
    source = #a78bfa;default
    media = #cfbffc;default
    graph = #a8cefc;default
    database = #ffd096;default

[menu]
    _default_ = #e0e0e0;#1f2230
    menusel = #f4f4f8;#3a3157
    menuhot = #ffaa40;#1f2230
    menuhotsel = #ffd096;#3a3157
    menuinactive = #b4bfce;#12121a

[popupmenu]
    _default_ = #e0e0e0;#1f2230
    menusel = #f4f4f8;#3a3157
    menutitle = #ffaa40;#1f2230;bold

[buttonbar]
    hotkey = #f4f4f8;#372612
    button = #e0e0e0;#12121a

[statusbar]
    _default_ = #e0e0e0;#12121a

[help]
    _default_ = #e0e0e0;#12121a
    helpitalic = #22d3ee;#12121a;italic
    helpbold = #ffaa40;#12121a;bold
    helplink = #60a5fa;#12121a
    helpslink = #f4f4f8;#3a3157
    helptitle = #a78bfa;#12121a;bold

[editor]
    _default_ = #e0e0e0;default
    editbold = #ffaa40;default;bold
    editmarked = #f4f4f8;#3a3157
    editwhitespace = #5a6273;default
    editlinestate = #b4bfce;#12121a
    bookmark = #050507;#fbbf24
    bookmarkfound = #050507;#2ec66a
    editrightmargin = #b4bfce;#12121a
    editframeactive = #ffaa40;default
    editframedrag = #2ec66a;default
    editframe = #8d97a8;default
    editbg = #e0e0e0;default

[viewer]
    _default_ = #e0e0e0;default
    viewbold = #ffaa40;default;bold
    viewunderline = #22d3ee;default;underline
    viewselected = #050507;#ffaa40

[diffviewer]
    added = #f4f4f8;#0d2c1b
    changedline = #f4f4f8;#172538
    changednew = #f4f4f8;#564211
    changed = #f4f4f8;#233a57
    removed = #f4f4f8;#351118
    error = #f4f4f8;#1d0b10
    _default_ = #e0e0e0;default

[widget-panel]
    sort-up-char = ▴
    sort-down-char = ▾
    hiddenfiles-show-char = •
    hiddenfiles-hide-char = ○
    history-prev-item-char = ◂
    history-next-item-char = ▸
    history-show-list-char = ▾
    filename-scroll-left-char = ◂
    filename-scroll-right-char = ▸
    hiddenfiles-sign-show = •
    hiddenfiles-sign-hide = ○
    history-prev-item-sign = ◂
    history-next-item-sign = ▸
    history-show-list-sign = ▾

[widget-scrollbar]
    first-vert-char = ▴
    last-vert-char = ▾
    first-horiz-char = ◂
    last-horiz-char = ▸
    current-char = ■
    background-char = ▒

[widget-editor]
    window-state-char = ↕
    window-close-char = ✕

[widget-common]
    sort-sign-up = ↑
    sort-sign-down = ↓
