# Quality gate for every PR and push to main: formatting, licence headers, and the generated themes.
#
# (c) Copyright 2026 Liminal HQ, Scott Morris
# SPDX-License-Identifier: Apache-2.0 OR MIT

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  format:
    name: Format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile

      - name: Check formatting
        id: format
        run: bun run format:check

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Format"
            echo "- Result: \`${{ steps.format.outcome }}\`"
            echo "- Command: \`bun run format:check\`"
          } >> "${GITHUB_STEP_SUMMARY}"

  licence-headers:
    name: Licence headers
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check licence headers
        id: headers
        run: bash scripts/check-headers.sh

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Licence headers"
            echo "- Result: \`${{ steps.headers.outcome }}\`"
            echo "- Command: \`bash scripts/check-headers.sh\`"
          } >> "${GITHUB_STEP_SUMMARY}"

  themes:
    name: Themes
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile

      - name: Check release notes
        id: notes
        run: bun run check:release-notes

      - name: Run unit tests
        id: tests
        run: bun run test

      # Regenerates the themes from the palette and fails if the committed files differ.
      - name: Check generated themes are up to date
        id: drift
        run: bun run check:themes

      - name: Validate themes (schema and contrast)
        id: validate
        run: bun run validate:themes

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Themes"
            echo "- Release notes: \`${{ steps.notes.outcome }}\` (\`bun run check:release-notes\`)"
            echo "- Unit tests: \`${{ steps.tests.outcome }}\` (\`bun run test\`)"
            echo "- Generated files in sync: \`${{ steps.drift.outcome }}\` (\`bun run check:themes\`)"
            echo "- Schema and contrast: \`${{ steps.validate.outcome }}\` (\`bun run validate:themes\`)"
          } >> "${GITHUB_STEP_SUMMARY}"

  desktop-style:
    name: Desktop style
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      - uses: ./.github/actions/desktop-tools

      # Rebuilds both ReactOS styles and the pointers, then compares them with the committed hashes and scheme files.
      - name: Check the desktop style and pointers
        id: desktop
        run: bun run check:desktop

      # The logon renderer tests skip in the plain unit test run, which has no rsvg-convert; here they run for real.
      - name: Test the logon renderer
        id: logon
        run: node --test scripts/render-logon.test.mjs
      # The boot renderer tests skip in the plain unit test run, which has no rsvg-convert; here they run for real.
      - name: Test the boot renderer
        id: boot
        run: node --test scripts/render-boot.test.mjs
      # The Start renderer tests skip in the plain unit test run, which has no rsvg-convert; here they run for real.
      - name: Test the Start renderer
        id: start
        run: node --test scripts/render-start.test.mjs
      # The icon renderer tests skip in the plain unit test run, which has no rsvg-convert; here they run for real.
      - name: Test the icon renderer
        id: icons
        run: node --test scripts/render-icons.test.mjs
      # The dialog renderer tests skip in the plain unit test run, which has no rsvg-convert; here they run for real.
      - name: Test the dialog renderer
        id: dialogs
        run: node --test scripts/render-dialogs.test.mjs
      # The card renderer tests skip in the plain unit test run, which has no rsvg-convert; here they run for real.
      - name: Test the card renderer
        id: cards
        run: node --test scripts/render-cards.test.mjs

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Desktop style"
            echo "- Result: \`${{ steps.desktop.outcome }}\`"
            echo "- Command: \`bun run check:desktop\`"
            echo "- Logon renderer tests: \`${{ steps.logon.outcome }}\`"
            echo "- Boot renderer tests: \`${{ steps.boot.outcome }}\`"
            echo "- Start renderer tests: \`${{ steps.start.outcome }}\`"
            echo "- Icon renderer tests: \`${{ steps.icons.outcome }}\`"
            echo "- Dialog renderer tests: \`${{ steps.dialogs.outcome }}\`"
            echo "- Card renderer tests: \`${{ steps.cards.outcome }}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

  bundle:
    name: Release bundle
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - uses: ./.github/actions/desktop-tools

      - name: Build release assets
        id: bundle
        run: bun run bundle

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Release bundle"
            echo "- Result: \`${{ steps.bundle.outcome }}\`"
            echo "- Command: \`bun run bundle\`"
          } >> "${GITHUB_STEP_SUMMARY}"
