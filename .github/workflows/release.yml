# Validates and bundles the themes, then attaches them to a GitHub release.
#
# (c) Copyright 2026 Liminal HQ, Scott Morris
# SPDX-License-Identifier: Apache-2.0 OR MIT

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Optional release tag (must start with v). Defaults to v<package.json version>.
        required: false
        type: string
      release_draft:
        description: Create the release as a draft
        required: false
        default: false
        type: boolean

concurrency:
  group: "release-${{ github.event_name }}-${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}"
  cancel-in-progress: true

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  verify-and-build:
    name: Verify and bundle themes
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      tag_name: ${{ steps.meta.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile

      - name: Resolve release tag
        id: meta
        env:
          INPUT_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail

          PACKAGE_VERSION="$(node -p "require('./package.json').version")"

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            TAG="${INPUT_TAG:-v${PACKAGE_VERSION}}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi

          if [[ ! "${TAG}" =~ ^v.+$ ]]; then
            echo "Invalid release tag: ${TAG}" >&2
            echo "Expected a tag matching v*" >&2
            exit 1
          fi

          echo "tag_name=${TAG}" >> "${GITHUB_OUTPUT}"

      - name: Check tag matches package.json version
        if: github.event_name == 'push'
        env:
          TAG_NAME: ${{ steps.meta.outputs.tag_name }}
        run: |
          set -euo pipefail
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          EXPECTED_TAG="v${PACKAGE_VERSION}"
          if [[ "${TAG_NAME}" != "${EXPECTED_TAG}" ]]; then
            echo "Tag ${TAG_NAME} does not match package.json version ${PACKAGE_VERSION} (expected ${EXPECTED_TAG})" >&2
            exit 1
          fi

      - name: Check tag is on main
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "Release tags must point at a commit on main" >&2
            exit 1
          fi

      - name: Run the full validation gate
        run: bun run validate

      - name: Build release assets
        run: bun run bundle

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: dist/release/*
          if-no-files-found: error

  publish-release:
    name: Attach themes to GitHub release
    runs-on: ubuntu-24.04
    needs: verify-and-build
    permissions:
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v5
        with:
          name: release-assets
          path: release-assets

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.verify-and-build.outputs.tag_name }}
          name: Afterglow themes ${{ needs.verify-and-build.outputs.tag_name }}
          target_commitish: ${{ github.sha }}
          draft: ${{ github.event_name == 'workflow_dispatch' && inputs.release_draft }}
          generate_release_notes: true
          files: release-assets/*
          fail_on_unmatched_files: true
          overwrite_files: true

      - name: Write summary
        env:
          TAG_NAME: ${{ needs.verify-and-build.outputs.tag_name }}
        run: echo "## Released ${TAG_NAME}" >> "${GITHUB_STEP_SUMMARY}"
