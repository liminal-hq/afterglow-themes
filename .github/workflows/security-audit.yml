name: Security Audit (zizmor)

on:
  pull_request:
  push:
    branches:
      - main

permissions: {}

jobs:
  zizmor:
    name: Audit workflows with zizmor
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Non-blocking, matching the other Liminal HQ repositories: findings upload to the Security
      # tab for visibility without failing the run.
      - name: Run zizmor
        uses: zizmorcore/zizmor-action@v0.6.4
        continue-on-error: true
